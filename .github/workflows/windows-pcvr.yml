name: Windows PCVR

on:
  push:
    branches: [hotd2-vr, 'codex/**']
  pull_request:
    branches: [hotd2-vr]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 PCVR Release
    runs-on: windows-2022

    steps:
      # actions pinned to a commit (the tag in the comment): the exe is what testers download
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      - name: Configure PCVR Release
        run: cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_OPENXR=ON -DUSE_DX9=OFF

      - name: Build
        run: cmake --build build-win --parallel

      - name: Package PCVR files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pcvr-artifact | Out-Null
          Copy-Item build-win/flycast.exe pcvr-artifact/flycast.exe
          Copy-Item LICENSE pcvr-artifact/LICENSE.txt
          @'
          [config]
          pvr.rend = 0
          rend.NativeDepthInterpolation = yes
          vr.Xr = yes
          '@ | Set-Content -Encoding ascii pcvr-artifact/emu.cfg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hotd2-vr-pcvr-windows-x64
          path: pcvr-artifact/*
